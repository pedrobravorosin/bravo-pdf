name: testes
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  testes:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-15]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: "python -m pip install --require-hashes --only-binary=:all: -r app/requirements.txt"
      - run: bash ferramentas/baixar-tessdata.sh
        shell: bash
      - run: python -m unittest discover tests -v
